[interchange.reference.tags]
# psuedogrammar: "[ '(' category_name ')' ] [ backlink_tag [ ',' union_backlink_tag_member ] '/' ]* main_tag [ '|' main_tag_alias ]*"
#
# examples:
#   'X'           -> standalone tag
#   'X / Y'       -> main tag Y, with backlink to X
#   'X / Y / Z'   -> main tag Z, with backlink to Y, and Y has a backlink to X
#   'A | B'       -> tag A, but also known as B (project entry tag choice takes precedence in display)
#   'G, H / I'    -> interpreted as '(G, H) / I' -> I has backlink to G and H
#
# note on interpreting union backlinks in the middle of a backlink path:
#     as an example,     `Q / R, S / T`
#     is interpreted as: `Q / (R, S) / T`
#     because unions, denoted by commas, are parsed between slashes
#
#     so: `Q / R, S / T`
#         -> ["Q", "R, S", "T"]
#         -> [Backlink("Q"), UnionBacklink(["R", "S"]), MainTag("T")]
#
#     which finally gets resolved to:
#         Tag(name=["Q"], frontlinks=["R", "S"])
#         Tag(name=["R"], frontlinks=["T"], backlinks=["Q"])
#         Tag(name=["S"], frontlinks=["T"], backlinks=["Q"])
#         Tag(name=["T"], backlinks=["R", "S"])
#
# note on tag aliases:
#     only valid for main tags
# 
#     'J / K | L / M' -> invalid, don't alias in the middle of a backlink path
#     'J / K / L | M' -> valid, aliasing at the end for a main tag is ok
#
#     why? because parsing ambiguity if it were mixed with unions
#
# notes on escaping:
#     in the rare case there is a need to escape a forward slash,
#     or pipe character, use a backslash before it
#
#     it will be cheaply replaced with a temporary placeholder,
#     which will be replaced back after parsing
#
# notes on categories:
#     since tags may backlink to tags from different categories,
#     it is recommended to use prefix the category name in brackets
#     to override what would be the inferred main tag category via
#     its backlinks
# 
#     example: the project messes with audio metadata
#         "(Features) Audio Metadata"
# 
#         without the bracketed category override, it would be inferred
#         to be under the `File Formats` category
#     
#     although i use the verbiage "override", the original category
#     of Audio Metadata (File Formats) is preserved as an 'indirect'
#     category and depending on what you do with indirect categories,
#     may be exposed to the user for selection, filtering, etc
#
# for new tags:
#     this list is non-exhaustive, however, if listing a new tag,
#     it must have a backlink to a tag listed here
#     (or just add it to the reference list)
# 
#     example: the TASOLLER, a game controller (hardware) not listed here
#         "Peripherals / Game Controllers / TASOLLER"
# 
#         why: `Hardware / Peripherals` is listed here under hardware,
#         so the TASOLLER tag is inferred to be hardware 
# 
#     example: whatsmeow, a go library, not listed here
#         "(Libraries) Go / whatsmeow"
# 
#         why: Go is listed here under `Languages, Formats and Tooling`
#         so prefixing it with a bracketed category name denotes that
#         the tag whatsmeow is under the `Libraries` category
# 
#     prefixing the projects tag with `(<category>)` is the way to go
#
# expanding examples:
#     toml:       `Libraries = [ "Pillow" ]`
#     expands to: "Python / Pillow"
#                 and "Visual / Image Manipulation / Pillow"
#
#     meaning that the project will have the direct tags: "Pillow",
#     but the indirect tags "Python", "Visual", "Image Manipulation",
#     allowing for filtering of Interchange projects

